<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Logística</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; background: var(--escuro); margin: 0; 
        }
        .login-box { 
            background: #fff; padding: 40px 30px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); width: 100%; max-width: 380px; 
            text-align: center; border-top: 5px solid var(--laranja); 
        }
        .login-box h1 { margin-top: 0; font-family: var(--fonte-titulo); color: var(--escuro); }
        .login-box i.icone-logo { font-size: 3.5rem; color: var(--azul); margin-bottom: 15px; }
        .mensagens-login { margin-bottom: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="login-box">
        <i class="fas fa-truck-moving icone-logo"></i>
        <h1>Acesso Restrito</h1>
        <p class="apoio">Painel de Logística - Fatec</p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
        <div class="mensagens-login">
            {% for categoria, mensagem in mensagens %}
            <div class="msg msg-{{ categoria }}" style="padding: 10px; font-size: 0.9rem;">{{ mensagem }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('login') }}">
            <label style="text-align: left;">Senha de Administrador
                <input type="password" name="senha" required placeholder="Digite a senha..." autofocus style="margin-bottom: 25px; padding: 12px; font-size: 1.1rem;">
            </label>
            <button class="btn btn-principal" type="submit" style="padding: 12px; font-size: 1.1rem;"><i class="fas fa-sign-in-alt"></i> Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
